<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#397957"><meta name="description" content="大きすぎるほうきと頑張る新人さん。指で左右に動かす90秒のおそうじゲーム。"><title>ほうきがでかすぎます！</title><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css"></head>
<body><main id="app" data-phase="title">
<header id="status" hidden><div><small>そうじスコア</small><strong id="score">00000</strong></div><div class="time"><small>あと</small><strong id="time">90</strong><small>秒</small></div><button id="pause" aria-label="一時停止">Ⅱ</button></header>
<div id="progress" hidden><i></i></div>
<section id="board" aria-label="掃除する廊下"><canvas id="game" width="480" height="780" aria-label="巨大なほうきを引く新人さん。指を左右に滑らせて移動。"></canvas></section>
<div id="control" hidden><span id="combo">指で左右にスライド</span><small>← 指を離すと止まります →</small></div>
<section id="title" class="screen"><p class="eyebrow">90秒のドタバタおそうじ</p><h1>ほうきが<br><span>でかすぎます！</span></h1><canvas id="hero" width="480" height="370" aria-label="巨大ほうきに驚くかわいい新人さん"></canvas><p class="quote">こんなに大きいの、聞いてません！</p><p class="hint">指で左右に動かして、まとめて掃こう。<br>広く掃けるけど、家具には気をつけて！</p><button id="start" class="primary">おしごとをはじめる <span>→</span></button><p class="best">自己ベスト <b id="best">0</b> 点</p><p class="version">ブラウザ試作 v1 · 90秒でひとしごと</p></section>
<section id="dialogue" class="screen overlay" hidden><canvas id="scene" width="480" height="370" aria-label="清掃リーダーと新人さん"></canvas><div class="card"><p class="eyebrow" id="speaker"></p><p id="line"></p><button id="next" class="primary">つづく →</button></div></section>
<section id="ready" class="float" hidden><strong id="count">3</strong><p>下のエリアで左右にスライド</p></section>
<section id="paused" class="screen overlay" hidden><div class="card"><p class="eyebrow">ひとやすみ</p><h2>ふう、ちょっと休憩。</h2><p>時間は止まっています。</p><button id="resume" class="primary">おしごとに戻る →</button><button class="secondary home">タイトルへ</button></div></section>
<section id="results" class="screen overlay" hidden><div class="card"><p class="eyebrow">90秒のおしごと、終了！</p><h2>おつかれさま！</h2><canvas id="resultHero" width="480" height="220" aria-label="笑顔の新人さん"></canvas><p class="quote">手伝ってくれて、ありがとう！</p><strong id="finalScore" class="result-score"></strong><p id="stats"></p><p id="record"></p><button id="retry" class="primary">同じ廊下でもう一回 →</button><button class="secondary home">タイトルへ</button></div></section>
<p id="storageNote" class="storage-note" hidden>このブラウザでは記録を保存できません。ゲームは遊べます。</p>
</main><script type="module" src="./app.js"></script></body></html>
